<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rhyme Monsters</title>
<meta name="description" content="ディスに韻で返すラップバトルゲーム。相棒のモンスターと、もっと速く、もっと長く。ブラウザですぐ遊べる。">
<meta name="theme-color" content="#0E0B22">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
/* phones and narrow windows: the game itself, full screen. wide screens: the same phone-shaped game, framed. */
(function () {
  var q = location.search + location.hash;
  var wide = innerWidth >= 760 && innerWidth > innerHeight * 0.9 && !/[?&]full=1/.test(location.search);
  if (!wide) { location.replace('game.html' + q); return; }
  window.__frameSrc = 'game.html' + q;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root { --ink: #0E0B22; --bone: #F3EFE6; --lime: #D4FF3A; --orange: #FF4D1A; --violet: #7A2BFF; --mute: #A8A4BF; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--bone); font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; font-weight: 700; overflow: hidden; }
.bg { position: fixed; inset: 0; background:
  repeating-linear-gradient(-28deg, rgba(212,255,58,.05) 0 18px, transparent 18px 44px),
  radial-gradient(80% 70% at 50% 50%, #241a55 0%, var(--ink) 70%); }
.stage { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: clamp(16px, 3vw, 56px); padding: 0 clamp(16px, 3vw, 48px); box-sizing: border-box; }
.phone { height: calc(100vh - 32px); aspect-ratio: 9 / 16.5; max-width: 600px; position: relative; border-radius: 26px; overflow: hidden; background: #000; box-shadow: 0 0 0 3px #2a2350, 14px 14px 0 var(--orange), 0 30px 80px rgba(0,0,0,.6); }
.phone iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.side { min-width: 0; display: grid; gap: 18px; }
.left { justify-items: end; text-align: right; }
.right { justify-items: start; }
.emb { width: clamp(90px, 11vw, 190px); filter: drop-shadow(0 10px 0 rgba(0,0,0,.35)); animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
.wm { margin: 0; display: grid; justify-items: end; transform: rotate(-6deg); font: italic 800 clamp(34px, 5vw, 92px)/.82 "Bricolage Grotesque", "Arial Black", sans-serif; letter-spacing: -.05em; }
.wm .a { color: var(--lime); text-shadow: .05em .05em 0 var(--orange), .1em .1em 0 var(--bone); }
.wm .b { color: var(--bone); font-size: .66em; text-shadow: .06em .06em 0 var(--orange); }
.jp { display: inline-block; padding: 4px 14px; background: var(--orange); color: var(--ink); font: 400 clamp(13px, 1.4vw, 20px) "Dela Gothic One", sans-serif; transform: rotate(-3deg); box-shadow: 4px 4px 0 var(--bone); }
.tag { font: 400 clamp(14px, 1.5vw, 22px)/1.4 "Dela Gothic One", sans-serif; color: var(--bone); }
.card { background: rgba(14,11,34,.8); border: 2px solid #2f2860; border-radius: 16px; padding: 16px 18px; display: grid; gap: 10px; max-width: 300px; }
.card h2 { margin: 0; font: 400 16px "Dela Gothic One", sans-serif; color: var(--lime); letter-spacing: .04em; }
.card p { margin: 0; font-size: 14px; line-height: 1.6; color: #DCD8E8; }
kbd { display: inline-block; min-width: 1.6em; padding: 1px 7px; border-radius: 6px; background: var(--bone); color: var(--ink); font: 800 12px/1.5 ui-monospace, Menlo, monospace; text-align: center; box-shadow: 0 2px 0 #8d88a8; }
.hash { font: 400 15px "Dela Gothic One", sans-serif; color: var(--mute); }
@media (max-width: 1100px) { .card { display: none; } }
@media (max-width: 980px) { .side { display: none; } .stage { grid-template-columns: 1fr; justify-items: center; } }
</style>
</head>
<body>
<div class="bg"></div>
<main class="stage">
  <section class="side left" aria-label="Rhyme Monsters">
    <img class="emb" src="emblem.svg" alt="">
    <h1 class="wm"><span class="a">RHYME</span><span class="b">MONSTERS/</span></h1>
    <span class="jp">ライム・モンスターズ</span>
    <p class="tag">打って、踏んで、<br>ブチかませ。</p>
  </section>
  <div class="phone"><iframe id="game" title="Rhyme Monsters" allow="autoplay; clipboard-write; web-share; fullscreen"></iframe></div>
  <section class="side right">
    <div class="card"><h2>あそびかた</h2><p>ディスの最後の言葉と<b>母音がそろう言葉</b>を打ちこんで返そう。</p><p><kbd>Enter</kbd> で送信</p></div>
    <div class="card"><h2>スマホでも遊べる</h2><p>同じURLをスマホで開くと全画面で遊べます。</p></div>
    <span class="hash">#ライムモンスターズ</span>
  </section>
</main>
<script>
if (window.__frameSrc) { var f = document.getElementById('game'); f.src = window.__frameSrc; f.addEventListener('load', function () { try { f.contentWindow.focus(); } catch (e) {} }); }
</script>
</body>
</html>
